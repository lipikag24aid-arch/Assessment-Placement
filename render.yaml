services:
  - type: web
    name: wellness-placement-portal
    runtime: python
    plan: starter
    rootDir: wellness_placement_portal
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    disk:
      name: wellness-portal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FACULTY_SIGNUP_KEY
        sync: false
      - key: BEHIND_PROXY
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/portal.db
      - key: PYTHON_VERSION
        value: 3.12.8
