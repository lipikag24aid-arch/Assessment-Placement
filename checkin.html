{% extends "base.html" %}{% block content %}
<div class="card narrow"><p class="eyebrow">DAILY CHECK-IN</p><h1>How are you today?</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% for k,l in [('mood','Mood'),('sleep','Sleep quality'),('energy','Energy'),('stress','Stress'),('focus','Focus')] %}
<label>{{ l }} (1 = low, 5 = high)</label><select name="{{ k }}" required>{% for i in range(1,6) %}<option value="{{ i }}" {{ 'selected' if i==3 }}>{{ i }}</option>{% endfor %}</select>
{% endfor %}
<label>Note (optional)</label><textarea name="note" maxlength="500" rows="3"></textarea>
<button>Save check-in</button></form></div>
{% endblock %}
